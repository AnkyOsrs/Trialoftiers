<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Trial of Tiers — OSRS Boss Tracker</title>

<!--
  ============================================================================
  TRIAL OF TIERS  —  drop this file in the SAME FOLDER as:
      OSRS_Bossing_Canvas_Updating.png   (the board background)
      runescape_bold.ttf                 (the font)
      UniqueDrop.mp3                     (the completion sound)

  Everything you might want to tweak lives in the CONFIG block at the top of
  the <script> tag near the bottom. Tile positions are given in PIXELS of the
  1280 x 720 board image, so you can read coordinates straight off the PNG in
  any image editor — no percentages to convert, no magic scale factors.
  ============================================================================
-->

<style>
@font-face{
  font-family:"RunescapeOS";
  src:url("runescape_bold.ttf") format("truetype");
  font-weight:normal; font-style:normal; font-display:swap;
}

:root{
  --board-w:1280;
  --board-h:720;
  --chrome:52px;          /* height reserved for the toolbar under the board */
  --ink:#f4e9c8;
  --gold:#ffd34d;
  --green:#5cff8f;
}

*{ box-sizing:border-box; }

html,body{ height:100%; }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px;
  background:
    radial-gradient(1200px 700px at 50% 30%, #2c2a26 0%, #171614 70%, #0e0d0c 100%);
  font-family:"RunescapeOS", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--ink);
  overflow:hidden;
}

/* ==========================================================================
   BOARD
   Scales to fill the screen on any monitor while staying locked to the
   1280:720 shape, so every pixel coordinate below lands where it should.
   ========================================================================== */
#image-container{
  position:relative;
  width:min(96vw, (96vh - var(--chrome)) * (1280/720));
  max-width:2400px;
  aspect-ratio:1280 / 720;
  container-type:inline-size;
  container-name:tracker;
  background-image:url('OSRS_Bossing_Canvas_Updating.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  background-position:center;
  box-shadow:0 0 30px rgba(0,0,0,.85), 0 0 90px rgba(0,0,0,.5);
  border-radius:4px;
  user-select:none;
  flex:0 0 auto;
}

#image-container.no-art{
  background-image:none;
  background-color:#2b2b28;
  outline:2px dashed rgba(255,255,255,.18);
}

/* ==========================================================================
   BOSS TILES
   Position/size are written by JS from the TILES table (board pixels).
   ========================================================================== */
.boss-tile{
  position:absolute;
  cursor:pointer;
  background-color:transparent;
  overflow:hidden;
  z-index:1200;
  transition:box-shadow .18s ease, background-color .15s ease,
             backdrop-filter .2s ease, transform .1s ease;
  /* OSRS slot silhouette — keeps the glow inside the notched frame */
  clip-path:polygon(9.5% 0%, 91% 0%, 91.3% 5%, 95% 5.1%, 95.3% 9%, 95% 9%,
                    100% 9.4%, 100% 91%, 95% 91%, 95% 95%, 91% 95%, 91% 100%,
                    9% 100%, 9% 95%, 6.5% 95%, 6.5% 91%, 0.5% 91%, 0.5% 9.5%,
                    6.5% 9.5%, 6.5% 6%, 9.5% 6%);
}
.boss-tile:focus-visible{
  outline:none;
  box-shadow:inset 0 0 0 2px rgba(255,235,150,.9), 0 0 14px rgba(255,220,120,.5);
}

/* ---- completed ----
   A soft green light glows from the middle of the slot and feathers out to the
   edges, so the whole tile reads as lit rather than just its frame. The
   ::after gradient is what fills the tile; mix-blend-mode: screen means it
   brightens the artwork's own colours instead of masking them. */
.boss-tile.completed{
  box-shadow:
    inset 0 0 20px 8px rgba(90,255,130,.16),
    inset 0 0 42px 16px rgba(60,220,110,.08),
    0 0 10px rgba(90,255,130,.16);
}
.boss-tile.completed::after{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%,
    rgba(150,255,170,.18) 0%,
    rgba(110,255,150,.10) 30%,
    rgba(80,255,120,.04) 55%,
    rgba(80,255,120,0) 82%);
  mix-blend-mode:screen;
  pointer-events:none;
}

/* ---- hover states ---- */
.boss-tile:hover:not(.completed):not(.locked){
  box-shadow:0 0 12px rgba(200,200,200,.28);
  background-color:rgba(200,200,200,.09);
}
.boss-tile.completed:hover{
  box-shadow:
    inset 0 0 26px 10px rgba(110,255,150,.24),
    inset 0 0 50px 18px rgba(70,230,120,.12),
    0 0 13px rgba(110,255,150,.24);
}
.boss-tile.completed:hover::after{
  background:radial-gradient(circle at 50% 50%,
    rgba(170,255,190,.24) 0%,
    rgba(120,255,160,.13) 30%,
    rgba(90,255,130,.05) 55%,
    rgba(90,255,130,0) 82%);
}

/* ---- locked ----
   A tile is a transparent div sitting ON TOP of the board image, so `filter`
   can only reach the tile's own padlock — it never touches the artwork behind.
   `backdrop-filter` is what actually makes a locked slot recede. */
.boss-tile.locked{
  cursor:not-allowed;
  backdrop-filter:grayscale(.85) brightness(.56);
  -webkit-backdrop-filter:grayscale(.85) brightness(.56);
}
.boss-tile.locked:hover{
  backdrop-filter:grayscale(.7) brightness(.68);
  -webkit-backdrop-filter:grayscale(.7) brightness(.68);
  box-shadow:none;
  background-color:transparent;
}
.boss-tile.locked::before{
  content:"\1F512";
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:2.7cqw;
  filter:grayscale(1) opacity(.72);
  text-shadow:0 2px 5px rgba(0,0,0,.95);
  pointer-events:none;
  z-index:5;
}

/* ---- sibling highlight while a tier header is hovered ---- */
.boss-tile.tier-hi:not(.completed){
  box-shadow:inset 0 0 0 2px rgba(255,215,110,.55), 0 0 12px rgba(255,200,90,.3);
  background-color:rgba(255,210,110,.08);
}
.boss-tile.tier-hi.completed{
  box-shadow:
    inset 0 0 0 2px rgba(255,215,110,.5),
    inset 0 0 26px 10px rgba(110,255,150,.2),
    0 0 12px rgba(255,200,90,.3);
}

/* click feedback */
.boss-tile:not(.locked):active{ transform:scale(.965); }

/* just-completed flourish */
@keyframes tile-flash{
  0%   { box-shadow:inset 0 0 0 3px rgba(190,255,210,.9), 0 0 30px rgba(120,255,160,.8); }
  100% { box-shadow:inset 0 0 0 3px rgba(190,255,210,0),  0 0 0 rgba(120,255,160,0); }
}
.boss-tile.flash{ animation:tile-flash 620ms ease-out; }

/* ==========================================================================
   INVISIBLE HOVER HOTSPOTS  (tier header plaques, slayer banner, level plaque)
   ========================================================================== */
.hotspot{
  position:absolute;
  z-index:1300;
  cursor:help;
  border-radius:6px;
  transition:box-shadow .18s ease, background-color .18s ease;
}
.hotspot:hover{
  background-color:rgba(255,220,130,.07);
  box-shadow:inset 0 0 0 1px rgba(255,220,130,.35), 0 0 16px rgba(255,200,90,.18);
}
.hotspot:focus-visible{
  outline:none;
  background-color:rgba(255,220,130,.1);
  box-shadow:inset 0 0 0 2px rgba(255,235,150,.8);
}

/* ==========================================================================
   TOOLTIPS  (one shared element for tiles, one for tier plaques)
   ========================================================================== */
.tip{
  position:absolute;
  z-index:2200;
  pointer-events:none;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .13s ease, transform .13s ease;
  background:linear-gradient(180deg,#181510,#0c0a07);
  border:1px solid rgba(255,205,105,.45);
  border-radius:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.85), inset 0 0 0 1px rgba(0,0,0,.6);
  padding:.75cqw 1cqw;
  line-height:1.5;
  white-space:normal;
  max-width:34cqw;
  color:var(--ink);
  font-size:1.05cqw;
}
.tip.show{ opacity:1; transform:translateY(0); }

.tip .t-name{
  display:block;
  font-size:1.5cqw;
  color:var(--gold);
  letter-spacing:.02em;
  margin-bottom:.15cqw;
}
.tip .t-sub{
  display:block;
  font-size:1cqw;
  color:#b9b09a;
  margin-bottom:.45cqw;
}
.tip .t-rule{ display:block; font-size:1.05cqw; color:#dfe9d8; }
.tip .t-rule b{ color:var(--green); font-weight:normal; }
.tip .t-xp{ color:#a6ff7a; }
.tip .t-hint{
  display:block;
  margin-top:.45cqw;
  padding-top:.4cqw;
  border-top:1px solid rgba(255,255,255,.12);
  font-size:.95cqw;
  color:#8d8571;
}
.tip .t-hint.done{ color:#7fd39a; }
.tip .t-hint.lock{ color:#e8a05a; }

/* --- tier tooltip extras --- */
#tier-tip{ width:26cqw; max-width:26cqw; }
#tier-tip .t-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:1cqw;
  border-bottom:1px solid rgba(255,205,105,.25);
  padding-bottom:.4cqw; margin-bottom:.55cqw;
}
#tier-tip .t-head .t-name{ margin:0; }
#tier-tip .t-unlock{ font-size:.95cqw; color:#b9b09a; white-space:nowrap; }
#tier-tip .t-lead{ font-size:1cqw; color:#cfc7b2; margin-bottom:.3cqw; display:block; }
#tier-tip .t-way{
  display:flex; align-items:flex-start; gap:.5cqw;
  font-size:1.05cqw; color:#e6f2e0; margin:.15cqw 0;
}
#tier-tip .t-way::before{ content:"•"; color:var(--green); flex:0 0 auto; }
#tier-tip .t-way b{ color:var(--green); font-weight:normal; }
#tier-tip .t-or{
  display:flex; align-items:center; gap:.5cqw;
  font-size:.9cqw; color:#a89b7c; letter-spacing:.14em;
  margin:.28cqw 0 .28cqw 1.5cqw;
}
#tier-tip .t-or::after{
  content:""; flex:1; height:1px; background:rgba(255,255,255,.1);
}
#tier-tip .t-ways{ margin-bottom:.55cqw; }
#tier-tip .t-foot{
  display:flex; justify-content:space-between; gap:1cqw;
  font-size:1cqw; color:#cfc7b2;
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:.45cqw; margin-top:.15cqw;
}
#tier-tip .t-foot b{ color:var(--gold); font-weight:normal; }
#tier-mini{
  height:.45cqw; min-height:4px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.16);
  border-radius:4px; overflow:hidden;
  margin:.15cqw 0 .45cqw;
}
#tier-mini i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,#0ecb46,#7dffb4);
  transition:width .3s ease;
}

/* ==========================================================================
   Prowess level WIDGET
   The stone plaque on the left is the "skill orb": hammer art, two level
   numbers split by the engraved diagonal, xp bar underneath.
   ========================================================================== */
#level-wrap{ position:absolute; inset:0; pointer-events:none; z-index:1500; }

.level-number{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:3.7cqw;
  line-height:1;
  color:#ffff00;
  text-shadow:3px 2px 0 rgba(0,0,0,.66), 0 0 7px rgba(0,0,0,.9);
  transform-origin:center;
}
/* centres of the two numbers, in board pixels: (307,341) and (349,387) */
#level-slot-1{ left:23.98%; top:47.36%; }
#level-slot-2{ left:27.27%; top:53.75%; }

#xp-bar-track{
  position:absolute;
  left:22.27%; top:56.92%;
  transform:translate(-50%,-50%);
  width:14.23%;
  height:.42cqw; min-height:5px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,236,170,.45);
  border-radius:5px;
  overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8), 0 1px 4px rgba(0,0,0,.6);
}
#xp-bar-fill{
  height:100%; width:0%;
  background:linear-gradient(90deg,#0ecb46,#4dffa0);
  box-shadow:0 0 6px rgba(80,255,140,.7);
  transition:width .32s ease;
}

@keyframes pop-scale{
  0%   { transform:translate(-50%,-50%) scale(.62); filter:brightness(1); }
  40%  { transform:translate(-50%,-50%) scale(1.18); filter:brightness(1.2); }
  100% { transform:translate(-50%,-50%) scale(1); }
}
.level-number.pop{ animation:pop-scale 420ms cubic-bezier(.2,.9,.2,1); }

/* floating "+N xp" */
.xp-drop{
  position:absolute;
  left:22.27%; top:52%;
  font-size:1.6cqw;
  color:#a6ff7a;
  text-shadow:0 1px 0 rgba(0,0,0,.95);
  pointer-events:none;
  z-index:1600;
  white-space:nowrap;
  animation:xp-float 1300ms ease-out forwards;
}
.xp-drop.minus{ color:#ff9a8a; }
@keyframes xp-float{
  0%   { opacity:1; transform:translate(-50%,0) scale(.95); }
  20%  { transform:translate(-50%,-18px) scale(1.05); }
  60%  { opacity:1; transform:translate(-50%,-52px) scale(1.02); }
  100% { opacity:0; transform:translate(-50%,-88px) scale(1); }
}

/* ==========================================================================
   MESSAGE PLAQUE  (the blank parchment panel on the right of the board)
   ========================================================================== */
#notice{
  position:absolute;
  left:61.41%;  top:42.92%;      /* 786,309 */
  width:29.06%; height:13.47%;   /* 372 x 97 */
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 1.4cqw;
  z-index:1700;
  pointer-events:none;
  font-size:1.7cqw;
  line-height:1.34;
  white-space:pre-line;
  color:#12206e;
  opacity:0;
  transition:opacity .26s ease;
}
#notice.show{ opacity:1; }
#notice.good{ color:#0d5a25; }
#notice.warn{ color:#8a3a12; }
#notice.big{ font-size:2.15cqw; }
#notice.long{ font-size:1.42cqw; }

#tier-badge{
  position:absolute;
  left:61.41%; top:42.92%;
  width:29.06%; height:13.47%;
  display:none;
  align-items:center; justify-content:center;
  text-align:center;
  z-index:1750;
  pointer-events:none;
  font-size:2.6cqw;
  color:#0b7a2e;
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
#image-container.tier-complete #tier-badge{
  display:flex;
  animation:badge-pop 700ms cubic-bezier(.2,.9,.2,1);
}
/* the badge and the toast share the parchment plaque — never both at once */
#image-container.msg-live #tier-badge{ display:none; }
@keyframes badge-pop{
  0%   { transform:translateY(16px) scale(.85); opacity:0; }
  60%  { transform:translateY(-4px) scale(1.05); opacity:1; }
  100% { transform:translateY(0) scale(1); opacity:1; }
}

#image-container.tier-complete::after{
  content:"";
  position:absolute; inset:-14px;
  border-radius:10px;
  z-index:1400;
  pointer-events:none;
  box-shadow:
    0 0 18px rgba(255,220,80,.85),
    0 0 60px rgba(255,160,50,.55),
    inset 0 0 30px rgba(255,240,200,.08);
  animation:glow-pulse 1200ms ease-in-out infinite alternate;
}
@keyframes glow-pulse{
  from{ filter:drop-shadow(0 0 10px rgba(255,220,80,.7)); }
  to  { filter:drop-shadow(0 0 26px rgba(255,160,50,.9)); }
}
#image-container.tier-complete .level-number{
  color:#fff9e6;
  text-shadow:0 1px 0 rgba(0,0,0,.95), 0 0 10px rgba(255,240,120,.8), 0 0 18px rgba(255,200,60,.7);
}

/* ==========================================================================
   TOOLBAR
   ========================================================================== */
#toolbar{
  width:min(96vw, (96vh - var(--chrome)) * (1280/720));
  max-width:2400px;
  height:36px;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  background:linear-gradient(180deg,#3b352b,#241f19);
  border:1px solid #564c3a;
  border-radius:6px;
  box-shadow:0 6px 16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  font-size:13px;
}
#tb-stats{ color:#cbbf9f; letter-spacing:.02em; }
#tb-stats b{ color:var(--gold); font-weight:normal; }
#tb-stats .sep{ color:#6b6151; margin:0 7px; }
#tb-spacer{ flex:1; }

.tb-btn{
  appearance:none;
  font-family:inherit;
  font-size:13px;
  color:#e7dcc2;
  background:linear-gradient(180deg,#5a5041,#3a332a);
  border:1px solid #6d6151;
  border-radius:5px;
  padding:5px 11px;
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, color .15s ease;
}
.tb-btn:hover{ background:linear-gradient(180deg,#6b6050,#453d32); border-color:#8a7c66; }
.tb-btn:active{ transform:translateY(1px); }
.tb-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
.tb-btn.armed{
  background:linear-gradient(180deg,#8c3a2c,#5e2419);
  border-color:#c05a42; color:#ffe2d6;
}
.tb-btn.off{ color:#8c8272; }

/* ---- volume slider ---- */
.tb-vol{
  -webkit-appearance:none; appearance:none;
  width:96px; height:16px;
  margin:0; padding:0;
  background:transparent;
  cursor:pointer;
  flex:0 0 auto;
  transition:opacity .15s ease;
}
.tb-vol.muted{ opacity:.42; }
.tb-vol:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }

/* the filled portion is driven by --vol-pct, which the script keeps in sync */
.tb-vol::-webkit-slider-runnable-track{
  height:6px;
  border:1px solid #6d6151;
  border-radius:3px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75);
  background:linear-gradient(90deg,
    #b99646 0 var(--vol-pct,70%), #241f19 var(--vol-pct,70%) 100%);
}
.tb-vol::-moz-range-track{
  height:6px;
  border:1px solid #6d6151;
  border-radius:3px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.75);
  background:linear-gradient(90deg,
    #b99646 0 var(--vol-pct,70%), #241f19 var(--vol-pct,70%) 100%);
}
.tb-vol::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:11px; height:16px;
  margin-top:-6px;                 /* centres the thumb on the 6px track */
  border:1px solid #443b2e;
  border-radius:2px;
  background:linear-gradient(180deg,#f2e3b8,#a89468);
  box-shadow:0 1px 3px rgba(0,0,0,.7);
}
.tb-vol::-moz-range-thumb{
  width:11px; height:16px;
  border:1px solid #443b2e;
  border-radius:2px;
  background:linear-gradient(180deg,#f2e3b8,#a89468);
  box-shadow:0 1px 3px rgba(0,0,0,.7);
}
#vol-val{
  color:#9d9280;
  font-variant-numeric:tabular-nums;
  min-width:34px;
  text-align:right;
}

@media (max-width:760px){
  #tb-stats .hide-sm{ display:none; }
  #toolbar{ font-size:12px; }
  .tb-vol{ width:70px; }
  #vol-val{ min-width:30px; }
}
</style>
</head>
<body>

<audio id="sfx-complete" src="UniqueDrop.mp3" preload="auto"></audio>
<audio id="sfx-levelup"  src="UniqueDrop.mp3" preload="auto"></audio>

<div id="image-container" role="application" aria-label="Trial of Tiers boss tracker">

  <!-- message plaque -->
  <div id="notice" aria-live="polite"></div>
  <div id="tier-badge">Trial of Tiers Completed!</div>

  <!-- Prowess level widget -->
  <div id="level-wrap">
    <div class="level-number" id="level-slot-1">1</div>
    <div class="level-number" id="level-slot-2">1</div>
    <div id="xp-bar-track"><div id="xp-bar-fill"></div></div>
  </div>

  <!-- tooltips -->
  <div class="tip" id="tile-tip" role="tooltip"></div>
  <div class="tip" id="tier-tip" role="tooltip"></div>

  <!-- boss tiles + hotspots are generated by the script below -->
</div>

<div id="toolbar">
  <span id="tb-stats"></span>
  <span id="tb-spacer"></span>
  <button class="tb-btn" id="btn-sound" type="button" title="Toggle sound (M)">🔊 Sound</button>
  <input class="tb-vol" id="vol" type="range" min="0" max="100" step="5" value="70"
         aria-label="Volume" title="Volume" />
  <span id="vol-val">70%</span>
  <button class="tb-btn" id="btn-reset" type="button" title="Reset all progress">↺ Reset</button>
</div>

<script>
"use strict";

/* ==========================================================================
 * 1. CONFIG — this is the only part you should ever need to edit.
 * ========================================================================== */

const BOARD_IMAGE = "OSRS_Bossing_Canvas_Updating.png";
const BOARD_W = 1280, BOARD_H = 720;
const STORAGE_KEY = "osrsTrialOfTiers_v4";

/* --- Tile rectangles, in PIXELS of the 1280x720 board image: [x, y, w, h] ---
   Measured directly off the PNG's slot grid: 89x89 slots on a 94px pitch,
   93x93 for the Slayer column and the centre/corner specialty tiles.        */
const TILES = {
  "Obor":                      [  27,  27, 89, 89],
  "Bryophyta":                 [ 121,  27, 89, 89],
  "Giant-Mole":                [ 215,  27, 89, 89],
  "Scurrius":                  [ 309,  27, 89, 89],
  "Sarachnis":                 [ 403,  27, 89, 89],
  "KBD":                       [  27, 121, 89, 89],
  "Amoxliatl":                 [ 121, 121, 89, 89],
  "Barrows":                   [ 403, 121, 89, 89],
  "Deranged-Archaeologist":    [  27, 215, 89, 89],
  "Chaos-Fanatic":             [ 121, 215, 89, 89],
  "Crazy-Archaeologist":       [ 215, 215, 89, 89],
  "Royal-Titans":              [ 309, 215, 89, 89],
  "Brutus":                    [ 403, 215, 89, 89],

  "Jad":                       [ 594, 102, 93, 93],

  "Prime":                     [ 786,  27, 89, 89],
  "Supreme":                   [ 880,  27, 89, 89],
  "Rex":                       [ 974,  27, 89, 89],

/* ==========================================================================
 * 4. TOOLTIP PLACEMENT
 * Positions a tooltip in board-pixel space, flipping above/below and
 * clamping to the board edges so it never spills off-screen.
 * ========================================================================== */

function place(tip, anchorEl){
  tip.style.visibility = "hidden";
  tip.classList.add("show");

  const bw = board.clientWidth, bh = board.clientHeight;
  const ax = anchorEl.offsetLeft, ay = anchorEl.offsetTop;
  const aw = anchorEl.offsetWidth, ah = anchorEl.offsetHeight;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const gap = bh * 0.012;
  const pad = bw * 0.008;

  let top = ay - th - gap;                       // prefer above
  if (top < pad) top = ay + ah + gap;            // otherwise below
  if (top + th > bh - pad) top = Math.max(pad, bh - pad - th);

  let left = ax + aw / 2 - tw / 2;               // centred on the anchor
  left = Math.max(pad, Math.min(left, bw - pad - tw));

  tip.style.left = left + "px";
  tip.style.top  = top + "px";
  tip.style.visibility = "";
}

function hide(tip){ tip.classList.remove("show"); }

function highlightTier(tier, on){
  (TIER_IDS[tier] || []).forEach(id => tileEls[id].classList.toggle("tier-hi", on));
}

function showTileTip(id){
  const tier = TILE_TIER[id];
  const t = TIERS[tier];
  const el = tileEls[id];
  const done = el.classList.contains("completed");
  const locked = el.classList.contains("locked");

  let hint, cls;
  if (locked)    { hint = `🔒 Reach Level ${t.unlock} to unlock this tier`; cls = "lock"; }
  else if (done) { hint = "✔ Complete — click to un-mark"; cls = "done"; }
  else           { hint = "Click to mark complete"; cls = ""; }

  const caLine = t.ca ? ` <b>or</b> green CA log` : ` <b>·</b> kill required`;

  tileTip.innerHTML =
    `<span class="t-name">${nameOf(id)}</span>` +
    `<span class="t-sub">${t.label} · unlocks at Level ${t.unlock}</span>` +
    `<span class="t-rule">${kcTextFor(tier)}${caLine} · ` +
      `<span class="t-xp">+${fmt(TILE_XP[id] || 0)} xp</span></span>` +
    `<span class="t-hint ${cls}">${hint}</span>`;

  place(tileTip, el);
}

function showTierTip(tier, anchorEl){
  const t = TIERS[tier];
  const ids = TIER_IDS[tier] || [];
  const done = ids.filter(id => tileEls[id].classList.contains("completed")).length;
  const total = ids.length;
  const vals = ids.map(id => TILE_XP[id] || 0).sort((a, b) => a - b);
  const range = vals.length > 1 && vals[0] !== vals[vals.length - 1]
    ? `${fmt(vals[0])}–${fmt(vals[vals.length - 1])}`
    : fmt(vals[0] || 0);

  const ways =
    `<div class="t-way"><span><b>${kcTextFor(tier)}</b></span></div>` +

      ? `<div class="t-or">OR</div>` +

      : "");
  const lead = t.ca
    ? "Mark a tile complete with either:"
    : "The only way to clear this tile:";
  const killOnly = t.ca ? "" : "Combat Achievements can't clear it — the kill is the requirement.";

  tierTip.innerHTML =
    `<div class="t-head">` +
      `<span class="t-name">${t.label}</span>` +
      `<span class="t-unlock">${unlocked ? "✔ unlocked" : "🔒 Level " + t.unlock}</span>` +
    `</div>` +
    `<span class="t-lead">${lead}</span>` +
    `<div class="t-ways">${ways}</div>` +
    (t.note || killOnly ? `<span class="t-lead">${t.note || killOnly}</span>` : "") +
    `<div id="tier-mini"><i style="width:${total ? (done / total * 100) : 0}%"></i></div>` +
    `<div class="t-foot">` +
      `<span><b>${done}</b> / ${total} tiles done</span>` +
      `<span>+<b>${range}</b> xp</span>` +

  place(tierTip, anchorEl);
}

/* ==========================================================================
 * 6. MESSAGE QUEUE  (parchment plaque on the right)
 * ========================================================================== */

let msgQueue = [], msgBusy = false;

function say(text, opts = {}){
  msgQueue.push(Object.assign({ text, ms: 1900, tone: "", big: false }, opts));
  if (!msgBusy) nextMsg();
}

function nextMsg(){
  const m = msgQueue.shift();
  if (!m){ msgBusy = false; board.classList.remove("msg-live"); return; }
  msgBusy = true;
  board.classList.add("msg-live");
  notice.textContent = m.text;
  // keep long messages inside the parchment plaque
  const lines = m.text.split("\n");
  const long = lines.length > 2 || lines.some(l => l.length > 34);
  notice.className = "show" + (m.tone ? " " + m.tone : "") +
                     (m.big && !long ? " big" : "") + (long ? " long" : "");
  setTimeout(() => {
    notice.classList.remove("show");
    setTimeout(nextMsg, 220);
  }, m.ms);
}

function clearMessages(){ msgQueue.length = 0; }


/* ==========================================================================
 * 7. STATE
 * ========================================================================== */

let totalXp = 0;
let currentLevel = 1;
let soundOn = true;
let volume = 0.7;   // 0 to 1

function levelForXp(xp){
  for (let L = MAX_LEVEL; L >= 1; L--) if (xp >= XP_TABLE[L]) return L;
  return 1;
}

function computeXp(){
  let xp = 0;
  IDS.forEach(id => { if (tileEls[id].classList.contains("completed")) xp += (TILE_XP[id] || 0); });
  return xp;
}

function save(){
  const done = IDS.filter(id => tileEls[id].classList.contains("completed"));
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ done, sound: soundOn, volume }));
  } catch(e){ /* private browsing — progress just won't persist */ }
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (typeof data.sound === "boolean") soundOn = data.sound;
    if (typeof data.volume === "number") volume = Math.min(1, Math.max(0, data.volume));
    (data.done || []).forEach(id => { if (tileEls[id]) tileEls[id].classList.add("completed"); });
  } catch(e){ console.warn("Could not read saved progress:", e); }
}

function playSfx(which){
  if (!soundOn || volume <= 0) return;
  const a = document.getElementById(which);
  if (!a) return;
  try { a.volume = volume; a.currentTime = 0; a.play().catch(() => {}); } catch(e){}
}


/* ==========================================================================
 * 8. RENDER
 * ========================================================================== */

function render(prevLevel){
  totalXp = computeXp();
  const lvl = levelForXp(totalXp);
  const levelled = prevLevel !== undefined && lvl !== prevLevel;
  currentLevel = lvl;

  lvlEls.forEach(el => {
    el.textContent = lvl;
    if (levelled){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  });

  const cur = XP_TABLE[lvl];
  const next = lvl < MAX_LEVEL ? XP_TABLE[lvl + 1] : cur;
  const span = next - cur;
  xpFill.style.width = (span > 0 ? Math.min(1, Math.max(0, (totalXp - cur) / span)) * 100 : 100) + "%";

  board.classList.toggle("tier-complete", totalXp >= MAX_XP);

  // lock / unlock tiles
  IDS.forEach(id => {
    const el = tileEls[id];
    const req = TIERS[TILE_TIER[id]].unlock;
    const done = el.classList.contains("completed");
    el.classList.toggle("locked", !done && lvl < req);
    el.setAttribute("aria-checked", done ? "true" : "false");
    el.setAttribute("aria-disabled", (!done && lvl < req) ? "true" : "false");
  });

  const doneCount = IDS.filter(id => tileEls[id].classList.contains("completed")).length;
  tbStats.innerHTML =
    `Prowess level <b>${lvl}</b>` +
    `<span class="sep">|</span>Tiles <b>${doneCount}</b> / ${IDS.length}` +
    `<span class="sep">|</span><span class="hide-sm">XP <b>${fmt(totalXp)}</b> / ${fmt(MAX_XP)}</span>`;

  return lvl;
}


/* ==========================================================================
 * 9. INTERACTION
 * ========================================================================== */

function toggle(id){
  const el = tileEls[id];
  const tier = TILE_TIER[id];
  const t = TIERS[tier];
  const willComplete = !el.classList.contains("completed");

  if (willComplete && el.classList.contains("locked")){
    clearMessages();
    say(`🔒 ${t.label} is locked.\nReach Prowess level ${t.unlock} to unlock it.`, { ms: 2300, tone: "warn" });
    return;
  }

  const prevLevel = currentLevel;
  el.classList.toggle("completed");
  const done = el.classList.contains("completed");
  const before = totalXp;

  if (done){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }

  save();
  const lvl = render(prevLevel);
  xpDrop(totalXp - before);

  clearMessages();
  say(done ? `${nameOf(id)}\nmarked COMPLETE` : `${nameOf(id)}\nmarked incomplete`,
      { ms: 1600, tone: done ? "good" : "" });

  if (done) playSfx("sfx-complete");

  if (lvl > prevLevel){
    playSfx("sfx-levelup");
    say(`Congratulations!\nTier Level ${lvl}`, { ms: 2400, tone: "good", big: true });
    Object.keys(TIERS).forEach(k => {
      const req = TIERS[k].unlock;
      if (req > prevLevel && req <= lvl && req > 1)
        say(`🔓 ${TIERS[k].label} unlocked!`, { ms: 2100, tone: "good" });
    });
  }

  // keep whichever tooltip is open in sync with the new state
  if (tileTip.classList.contains("show")) showTileTip(id);
}

function xpDrop(delta){
  if (!delta) return;
  const el = document.createElement("div");
  el.className = "xp-drop" + (delta < 0 ? " minus" : "");
  el.textContent = (delta > 0 ? "+" : "") + fmt(delta) + " xp";
  board.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}

/* ---- toolbar: sound ---- */
function paintSoundBtn(){
  const live = soundOn && volume > 0;
  btnSound.textContent = live ? "🔊 Sound" : "🔇 Muted";
  btnSound.classList.toggle("off", !live);
  btnSound.setAttribute("aria-pressed", String(live));

  const pct = Math.round(volume * 100);
  volSlider.value = pct;
  volSlider.style.setProperty("--vol-pct", pct + "%");
  volSlider.classList.toggle("muted", !soundOn);
  volVal.textContent = pct + "%";
}

btnSound.addEventListener("click", () => {
  soundOn = !soundOn;
  // un-muting with the slider at zero would still be silent, so give it a level
  if (soundOn && volume <= 0) volume = 0.5;
  paintSoundBtn();
  save();
});

volSlider.addEventListener("input", () => {
  volume = volSlider.value / 100;
  soundOn = volume > 0;      // dragging to zero mutes, dragging up un-mutes
  paintSoundBtn();
  save();
});
// play a tick when you let go, so you can hear the level you just set
volSlider.addEventListener("change", () => playSfx("sfx-complete"));

let resetArmed = null;
btnReset.addEventListener("click", () => {
  if (!resetArmed){
    btnReset.textContent = "Click again to confirm";
    btnReset.classList.add("armed");
    resetArmed = setTimeout(disarmReset, 4000);
    return;
  }
  disarmReset();
  IDS.forEach(id => tileEls[id].classList.remove("completed"));
  save();
  render();
  clearMessages();
  say("Progress reset.", { ms: 1800, tone: "warn" });
});
function disarmReset(){
  clearTimeout(resetArmed); resetArmed = null;
  btnReset.textContent = "↺ Reset";
  btnReset.classList.remove("armed");
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT") return;
  if (e.key === "m" || e.key === "M"){ soundOn = !soundOn; paintSoundBtn(); save(); }
  if (e.key === "Escape"){ hide(tileTip); hide(tierTip); }
});


/* ==========================================================================
 * 10. BOOT
 * ========================================================================== */

// Warn (gently) if the background art isn't sitting next to this file.
(function checkArt(){
  const probe = new Image();
  probe.onerror = () => {
    board.classList.add("no-art");
    say(`Background image not found:\n${BOARD_IMAGE}`, { ms: 6000, tone: "warn" });
  };
  probe.src = BOARD_IMAGE;
})();

load();
paintSoundBtn();
render();
</script>
